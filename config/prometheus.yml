global:
  scrape_interval: 5s
scrape_configs:
  - job_name: redpanda
    static_configs:
      - targets: [redpanda:9644]
  - job_name: platform
    static_configs:
      - targets: [app:9100, app:9101, app:9102, app:9103, app:9104]
  - job_name: local-platform
    static_configs:
      - targets: [host.docker.internal:9100, host.docker.internal:9101, host.docker.internal:9102, host.docker.internal:9103, host.docker.internal:9104]
