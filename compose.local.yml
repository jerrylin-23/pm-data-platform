name: pm-data-local
services:
  app:
    build: .
    command: ["pm", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PM_DATA_DIR: /data
      PM_DEMO: ${PM_DEMO:-0}
      PM_MAX_MARKETS: ${PM_MAX_MARKETS:-200}
    ports: ["127.0.0.1:${PM_HTTP_PORT:-8765}:8000"]
    volumes: ["local-data:/data", "./pairs.yml:/app/pairs.yml:ro"]
    restart: unless-stopped
volumes:
  local-data:
