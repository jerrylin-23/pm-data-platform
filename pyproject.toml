[build-system]
requires = ["setuptools==84.0.0", "pybind11==3.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-data-platform"
version = "0.1.0"
description = "C++ prediction market order books, durable capture, and deterministic replay"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2.6,<3", "websockets>=14,<17", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "pyarrow>=19,<24", "duckdb>=1.2,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "prometheus-client>=0.21,<1",
  "cryptography>=44", "pyyaml>=6,<7", "hdrhistogram>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.9,<1", "pybind11>=2.13", "backtrader>=1.9", "pandas>=2.2,<4"]

[project.scripts]
pm = "pmplatform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmplatform = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
